[package]
name = "magnetcut"
version = "0.1.0"
edition = "2024"
description = "MagnetCut's desktop app: the editor in apps/web, in a Tauri window"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["updater"]
# Updates from the GitHub releases. The App Store edition builds without it
# (--no-default-features): the App Store updates its own apps.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# generate_context! writes the plugins' configuration as serde_json values.
serde_json = "1"
# `native-tls`, not rustls, as in SecretCloud: ring and rustls fight the
# Windows cross-build. No `zip`: it only unpacks the old zip-wrapped bundles,
# and these updates are the installers themselves. `process` relaunches into
# the new version after a macOS or Linux install.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"], optional = true }
tauri-plugin-process = { version = "2", optional = true }
# Opens web links (the About box's, the release notes') in the browser:
# the window itself only ever shows the editor.
tauri-plugin-opener = "2"
# The open and save dialogs, from Rust: the editor gets the files picked,
# never a path of its own choosing (src/media.rs).
tauri-plugin-dialog = "2"
# The bookmarks of the media files the editor reads where they are.
base64 = "0.22"

# The drag pasteboard, for the paths of dropped files, and bookmarks, which
# the App Store sandbox needs to open a file again (src/media.rs). The
# versions Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSError", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
# The native export (src/render/): AVFoundation decodes the sources and
# encodes the film, and the editor's own compositor (rust/crates) draws each
# frame between them on the GPU, so no frame crosses into the web view.
objc2-av-foundation = { version = "0.3", features = ["block2", "objc2-core-media", "objc2-core-video"] }
objc2-avf-audio = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
compositor = { path = "../../rust/crates/compositor" }
gpu = { path = "../../rust/crates/gpu" }
# Waits for the GPU on the export's thread.
futures-executor = "0.3"

# AV1, which no Mac encodes in hardware, in software (BSD-2). Its assembly on
# Apple silicon is built with cc; on Intel it would need nasm.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }
[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

# The web view on Linux: its settings, to switch on the features the editor
# needs (src/webkit.rs). The versions Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
libc = "0.2"

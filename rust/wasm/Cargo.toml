[package]
name = "magnetcut-wasm"
version = "0.1.0"
edition = "2024"
description = "The editor's Rust side, for the web app as WebAssembly (packages/wasm builds it)"
repository = "https://github.com/magnetcut/magnetcut"
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/wasm.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
audio = { version = "0.1.0", path = "../crates/audio" }
bridge = { version = "0.1.0", path = "../crates/bridge" }
compositor = { version = "0.1.0", path = "../crates/compositor" }
console_error_panic_hook = "0.1.7"
effects = { version = "0.1.0", path = "../crates/effects" }
gpu = { version = "0.1.0", path = "../crates/gpu", features = ["wasm"] }
js-sys = "0.3.93"
masks = { version = "0.1.0", path = "../crates/masks" }
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
subtitles = { version = "0.1.0", path = "../crates/subtitles" }
time = { version = "0.1.0", path = "../crates/time", features = ["wasm"] }
transitions = { version = "0.1.0", path = "../crates/transitions", features = ["wasm"] }
wasm-bindgen = "0.2.116"
wasm-bindgen-futures = "0.4.66"
web-sys = { version = "0.3.93", features = ["OffscreenCanvas", "HtmlCanvasElement", "CanvasRenderingContext2d", "Document", "Window", "Performance"] }

[features]
default = ["wasm"]
wasm = []

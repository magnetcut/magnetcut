[package]
name = "compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
effects = { version = "0.1.0", path = "../effects" }
gl-transitions = { version = "=1.0.0", default-features = false, features = ["wgsl"] }
gpu = { version = "0.1.0", path = "../gpu" }
masks = { version = "0.1.0", path = "../masks" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
# The tests wait for the GPU.
futures-executor = "0.3"
# What wgpu's WebGL backend does to the shaders: the version wgpu uses.
naga = { version = "=29.0.1", features = ["wgsl-in", "glsl-out"] }

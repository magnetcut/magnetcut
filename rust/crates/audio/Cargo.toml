[package]
name = "audio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
path = "src/audio.rs"
crate-type = ["rlib"]

[dependencies]
# RNNoise in Rust. Without the default features: those are its command-line tool.
nnnoiseless = { version = "0.5.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

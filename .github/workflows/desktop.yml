name: Desktop

# The desktop app's own code linted and tested on each system, when it or the
# Rust core changes: much of it is for one system only (the native export on
# macOS, WebKitGTK's settings on Linux), and builds nowhere else. The editor
# isn't built: an empty folder stands in for its files.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "rust/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "rust/**"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # A writer waiting for a stream that never comes would otherwise hold the
    # runner for hours.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
          # The native export's GStreamer, its encoders and muxer, and Mesa's
          # software Vulkan for the tests' GPU.
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav mesa-vulkan-drivers

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('Cargo.lock') }}

      - name: Stand in for the editor's files
        shell: bash
        run: mkdir -p apps/web/out

      - name: Clippy
        run: cargo clippy -p magnetcut --all-targets -- -D warnings

      # Without a GPU, the tests that need one say so and pass.
      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test -p magnetcut

      # Side by side they sometimes end in a segmentation fault, one at a time
      # and under gdb never: should one crash, its core shows where, in gdb
      # afterwards.
      - name: Tests
        if: runner.os == 'Linux'
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$PWD/core.%p"
          tests=$(cargo test -p magnetcut --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1)
          # Five times, to catch it (about one run in three crashes), in
          # FFmpeg's GStreamer elements as an event goes down a pipeline.
          for attempt in 1 2 3 4 5; do
            cargo test -p magnetcut || break
            [ "$attempt" = 5 ] && exit 0
          done
          core=$(ls core.* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            sudo apt-get install -y gdb
            # Ubuntu's symbols, fetched as gdb needs them; then what every
            # thread was doing, the tests' own among them.
            DEBUGINFOD_URLS=https://debuginfod.ubuntu.com gdb -batch \
              -iex "set debuginfod enabled on" -ex "bt 40" -ex "thread apply all bt 30" \
              "$tests" "$core"
          fi
          exit 1

      # What Media Foundation has to encode with on the runner, and how its
      # greys come back.
      - name: Windows's encoders
        if: runner.os == 'Windows'
        run: cargo test -p magnetcut -- --nocapture lists_the_encoders keeps_greys_as_they_are

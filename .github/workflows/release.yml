name: Release builds

# The Windows and Linux installers of a release, built with no key or
# secret: apps/desktop/scripts/release.sh, on the maintainer's Mac, fetches
# them for its commit, signs them as updates, adds the macOS app and puts it
# all on a draft release (docs/RELEASING.md). It starts this run itself.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tools' own usage reporting, off.
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  TAURI_CLI: "@tauri-apps/cli@2.11.2"

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis,msi
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the packages run on the most
          # systems: they link the glibc and WebKitGTK they were built with.
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,rpm
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        # GStreamer's headers need libunwind-dev, which the image's LLVM
        # libunwind-14-dev conflicts with.
        run: |
          sudo apt-get update
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # The runners' Rust can be weeks old; the desktop app's let chains need 1.88.
      # The editor's core is built as WebAssembly, with wasm-pack.
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.4

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the editor's core and static files first (beforeBuildCommand).
      - name: Build the installers
        working-directory: apps/desktop
        run: bunx ${{ env.TAURI_CLI }} build --ci --bundles ${{ matrix.bundles }}

      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
